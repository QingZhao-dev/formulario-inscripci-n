
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<header>
    <h1>Formulario de inscripción</h1>
    <p>Completa tus datos para inscribirte al evento.</p>
</header>

<main>  
     <form id="formulario">   
    <div>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>

    <div>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div>
        <label for="entrada">Tipo de entrada</label>
        <select id="entrada" name="entrada" required>
            <option value="">Selecciona una opción</option>
            <option value="general">General</option>
            <option value="vip">VIP</option>
        </select>
    </div>

    <div>
        <label for="comentarios">Comentarios (opcional)</label>
        <textarea id="comentarios" name="comentarios" rows="4"></textarea>
    </div>

    <div>
        <input type="checkbox" id="privacidad" name="privacidad" required>
        <label for="privacidad">Acepto la política de privacidad</label>
    </div>

    <button type="submit">Inscribirme</button>


    </form> 
    <div id="confirmacion" hidden></div>
</main>
    <script src="script.js"></script>
</body>
</html>
